# cargo-audit advisory ignore list
#
# `cargo audit` reports no vulnerabilities for Cargo.lock. The entries below are
# its remaining warnings (unmaintained or unsound crates). None has a fix that a
# dependency update can reach.
# Reviewed: 2026-11-22

[advisories]
ignore = [
    # ── Tauri 2.x → wry/tao/muda → gtk3 bindings (Linux only) ──
    # GTK4 migration tracked: https://github.com/tauri-apps/tauri/issues/7335
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained, via glib-macros)
    "RUSTSEC-2024-0429", # glib 0.18 (VariantStrIter unsoundness)

    # ── tauri-plugin-opener, tauri-plugin-single-instance → zbus 5 (Linux only) ──
    # These crates were merged into zbus 6; the plugins still depend on zbus 5.
    "RUSTSEC-2026-0370", # zvariant (unmaintained)
    "RUSTSEC-2026-0371", # zbus_names (unmaintained)
    "RUSTSEC-2026-0372", # zvariant_derive (unmaintained)

    # ── serde_yaml 0.9 (direct dependency, deprecated upstream) ──
    "RUSTSEC-2024-0449", # unsafe-libyaml (unmaintained)

    # ── chrono (direct dependency; also via sqlx, turbomcp, oauth2, schemars) ──
    "RUSTSEC-2026-0543", # chrono (unmaintained, no patched release)
]
